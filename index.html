<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Food Calories Estimator</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#17231d;background:#f3f7f4}
*{box-sizing:border-box}body{margin:0;padding:28px 16px}
main{max-width:760px;margin:auto}.hero{padding:8px 4px 20px}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,40px);color:#176b48}
p{line-height:1.55;color:#53635a}.card{background:#fff;border:1px solid #e1ebe4;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 28px #173d2510}
label{display:block;font-weight:600;margin:14px 0 7px}
input,button{font:inherit;width:100%;padding:12px;border-radius:10px}
input{border:1px solid #cbd8cf;background:#fff}
button{border:0;background:#198754;color:white;font-weight:700;margin-top:18px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#status{white-space:pre-wrap;margin-top:16px;color:#43534a}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.metric{background:#f0f8f2;border-radius:12px;padding:14px}.metric small{color:#52685a}.metric strong{display:block;font-size:22px;margin-top:5px}
#foodName{font-size:21px;font-weight:700;margin-top:14px}
footer{font-size:12px;color:#66766c;padding:12px 4px}
</style>
</head>
<body><main>
<header class="hero"><h1>🥗 AI Food Calories Estimator</h1>
<p>Upload a food photo to estimate calories, protein, carbohydrates and fat.</p></header>
<section class="card">
<form id="foodForm">
<label for="foodImage">Food image</label>
<input id="foodImage" type="file" accept="image/jpeg,image/png,image/webp" required>
<label for="quantity">Servings</label>
<input id="quantity" type="number" min="0.25" max="20" step="0.25" value="1" required>
<button id="submitBtn" type="submit">Analyze food</button>
</form>
<div id="status" role="status"></div>
<div id="foodName"></div>
<div id="metrics" class="results" hidden>
<div class="metric"><small>Calories</small><strong id="calories">—</strong></div>
<div class="metric"><small>Protein</small><strong id="protein">—</strong></div>
<div class="metric"><small>Carbs</small><strong id="carbs">—</strong></div>
<div class="metric"><small>Fat</small><strong id="fat">—</strong></div>
</div>
</section>
<footer>Nutrition values are estimates and may vary with portion size and preparation.</footer>
</main>
<script>
const form=document.getElementById('foodForm');
const button=document.getElementById('submitBtn');
const statusBox=document.getElementById('status');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const file=document.getElementById('foodImage').files[0];
 const quantity=Number(document.getElementById('quantity').value);
 if(!file||!quantity||quantity<=0)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)){
   statusBox.textContent='Please choose a JPG, PNG, or WEBP image.';return;
 }
 button.disabled=true;statusBox.textContent='Analyzing your food photo…';
 document.getElementById('metrics').hidden=true;document.getElementById('foodName').textContent='';
 try{
  const base64=await new Promise((resolve,reject)=>{
   const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);
  });
  const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:base64,mime_type:file.type,quantity})});
  const text = await response.text();
let data;
try {
  data = JSON.parse(text);
} catch {
  throw new Error("API returned a non-JSON response: " + text.slice(0, 200));
}
  if(!response.ok)throw new Error(data.detail||'Analysis failed. Check your Vercel environment variable.');
  document.getElementById('foodName').textContent=data.food||'Food estimate';
  for(const key of ['calories','protein','carbs','fat']){
   const val=Number(data[key]);document.getElementById(key).textContent=(Number.isFinite(val)?val.toFixed(1):'—')+(key==='calories'?' kcal':' g');
  }
  document.getElementById('metrics').hidden=false;statusBox.textContent='Estimate ready.';
 }catch(err){statusBox.textContent='Could not analyze image: '+err.message;}
 finally{button.disabled=false;}
});
</script>
</body></html>
